# Local PostgreSQL only. Production runs the app image from Dockerfile
# and connects to a separately managed PostgreSQL instance.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: blackrivor
      POSTGRES_USER: blackrivor
      POSTGRES_PASSWORD: blackrivor
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackrivor -d blackrivor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
